<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport"
          content="width=device-width, initial-scale=1.0, viewport-fit=cover">

    <meta name="theme-color" content="#000000">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black">
    <meta name="apple-mobile-web-app-title" content="X7 Money">

    <title>X7 Money</title>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        html {
            background: #000;
        }

        body {
            font-family:
                -apple-system,
                BlinkMacSystemFont,
                "SF Pro Display",
                "Segoe UI",
                sans-serif;

            background: #000;
            color: #fff;
            min-height: 100vh;
            overflow-x: hidden;
        }

        button,
        input,
        select {
            font: inherit;
        }

        /* =========================
           STARTUP SCREEN
        ========================= */

        #splash {
            position: fixed;
            inset: 0;
            z-index: 9999;

            background:
                radial-gradient(
                    circle at 50% 40%,
                    #181818 0%,
                    #080808 35%,
                    #000 70%
                );

            display: flex;
            align-items: center;
            justify-content: center;

            transition:
                opacity 0.8s ease,
                visibility 0.8s ease;
        }

        #splash.hidden {
            opacity: 0;
            visibility: hidden;
            pointer-events: none;
        }

        .splash-content {
            width: 90%;
            max-width: 420px;
            text-align: center;
            animation: splashIn 1.2s ease forwards;
        }

        .x7-logo {
            font-size: 86px;
            font-weight: 900;
            letter-spacing: -8px;
            line-height: 1;

            background: linear-gradient(
                135deg,
                #fff,
                #777
            );

            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;

            text-shadow:
                0 0 35px rgba(255,255,255,0.12);

            animation: logoPulse 2.5s ease-in-out infinite;
        }

        .good-morning {
            margin-top: 30px;

            font-size: 25px;
            font-weight: 700;
            letter-spacing: -0.5px;

            opacity: 0;
            animation: fadeUp 1s ease 0.6s forwards;
        }

        .quote {
            margin-top: 14px;

            color: #8c8c8c;
            font-size: 15px;
            line-height: 1.6;

            opacity: 0;
            animation: fadeUp 1s ease 1s forwards;
        }

        .loading-line {
            width: 100px;
            height: 2px;

            margin: 35px auto 0;

            background: #222;
            overflow: hidden;

            opacity: 0;
            animation:
                fadeUp 1s ease 1.2s forwards;
        }

        .loading-line::after {
            content: "";

            display: block;
            width: 40px;
            height: 100%;

            background: #fff;

            animation: loading 1.4s ease-in-out infinite;
        }

        @keyframes splashIn {
            from {
                opacity: 0;
                transform: scale(0.92);
            }

            to {
                opacity: 1;
                transform: scale(1);
            }
        }

        @keyframes logoPulse {
            0%, 100% {
                transform: scale(1);
                opacity: 0.85;
            }

            50% {
                transform: scale(1.035);
                opacity: 1;
            }
        }

        @keyframes fadeUp {
            from {
                opacity: 0;
                transform: translateY(12px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        @keyframes loading {
            0% {
                transform: translateX(-60px);
            }

            100% {
                transform: translateX(160px);
            }
        }

        /* =========================
           APP
        ========================= */

        #app {
            min-height: 100vh;
            padding:
                env(safe-area-inset-top)
                18px
                calc(30px + env(safe-area-inset-bottom));
        }

        .container {
            width: 100%;
            max-width: 620px;
            margin: auto;
        }

        /* HEADER */

        header {
            padding-top: 18px;
            padding-bottom: 25px;

            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .brand {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .brand-mark {
            width: 42px;
            height: 42px;

            display: flex;
            align-items: center;
            justify-content: center;

            border-radius: 13px;

            background: #fff;
            color: #000;

            font-weight: 900;
            font-size: 18px;
        }

        .brand-name {
            font-size: 18px;
            font-weight: 700;
        }

        .brand-sub {
            color: #666;
            font-size: 11px;
            margin-top: 2px;
        }

        /* BALANCE */

        .balance-card {
            position: relative;

            padding: 28px;

            border-radius: 28px;

            background:
                linear-gradient(
                    145deg,
                    #171717,
                    #090909
                );

            border: 1px solid #222;

            overflow: hidden;
        }

        .balance-card::before {
            content: "";

            position: absolute;

            width: 180px;
            height: 180px;

            top: -100px;
            right: -80px;

            background: #fff;
            opacity: 0.035;

            border-radius: 50%;
        }

        .balance-label {
            color: #777;
            font-size: 13px;
        }

        .balance {
            margin-top: 8px;

            font-size: 42px;
            font-weight: 800;

            letter-spacing: -2px;
        }

        .currency {
            font-size: 22px;
            color: #777;
            margin-right: 4px;
        }

        /* STATS */

        .stats {
            display: grid;
            grid-template-columns: 1fr 1fr;

            gap: 12px;

            margin-top: 12px;
        }

        .stat-card {
            padding: 20px;

            background: #0d0d0d;

            border: 1px solid #1d1d1d;
            border-radius: 20px;
        }

        .stat-title {
            color: #666;
            font-size: 12px;
        }

        .stat-value {
            margin-top: 8px;

            font-size: 21px;
            font-weight: 700;
        }

        .income {
            color: #e8e8e8;
        }

        .expense {
            color: #999;
        }

        /* ACTIONS */

        .actions {
            display: grid;
            grid-template-columns: 1fr 1fr;

            gap: 12px;

            margin-top: 18px;
        }

        .action-btn {
            border: none;
            border-radius: 18px;

            padding: 17px;

            cursor: pointer;

            font-weight: 700;

            transition:
                transform 0.2s ease,
                opacity 0.2s ease;
        }

        .action-btn:active {
            transform: scale(0.96);
        }

        .add-btn {
            background: #fff;
            color: #000;
        }

        .reset-btn {
            background: #151515;
            color: #aaa;
            border: 1px solid #252525;
        }

        /* TRANSACTIONS */

        .section-title {
            display: flex;
            justify-content: space-between;
            align-items: center;

            margin-top: 32px;
            margin-bottom: 12px;
        }

        .section-title h2 {
            font-size: 17px;
        }

        .count {
            color: #555;
            font-size: 12px;
        }

        .transactions {
            display: flex;
            flex-direction: column;
            gap: 9px;
        }

        .transaction {
            display: flex;
            align-items: center;
            justify-content: space-between;

            padding: 16px;

            background: #0b0b0b;

            border: 1px solid #181818;
            border-radius: 17px;

            animation: transactionIn 0.35s ease;
        }

        @keyframes transactionIn {
            from {
                opacity: 0;
                transform: translateY(8px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .transaction-left {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .transaction-icon {
            width: 40px;
            height: 40px;

            display: flex;
            align-items: center;
            justify-content: center;

            border-radius: 13px;

            background: #151515;

            font-size: 17px;
        }

        .transaction-name {
            font-weight: 600;
            font-size: 14px;
        }

        .transaction-date {
            color: #555;
            font-size: 11px;
            margin-top: 4px;
        }

        .transaction-amount {
            font-weight: 700;
            font-size: 14px;
        }

        .transaction-amount.expense {
            color: #999;
        }

        .transaction-amount.income {
            color: #fff;
        }

        .empty {
            text-align: center;

            padding: 35px 15px;

            color: #444;

            border: 1px dashed #1d1d1d;
            border-radius: 18px;
        }

        /* =========================
           MODAL
        ========================= */

        .modal {
            position: fixed;
            inset: 0;

            z-index: 5000;

            display: flex;
            align-items: flex-end;
            justify-content: center;

            padding: 15px;

            background: rgba(0,0,0,0.75);

            backdrop-filter: blur(10px);

            opacity: 0;
            visibility: hidden;

            transition:
                opacity 0.25s ease,
                visibility 0.25s ease;
        }

        .modal.show {
            opacity: 1;
            visibility: visible;
        }

        .modal-content {
            width: 100%;
            max-width: 600px;

            background: #101010;

            border: 1px solid #252525;
            border-radius: 28px;

            padding: 24px;

            transform: translateY(30px);

            transition:
                transform 0.3s ease;
        }

        .modal.show .modal-content {
            transform: translateY(0);
        }

        .modal-header {
            display: flex;
            justify-content: space-between;
            align-items: center;

            margin-bottom: 22px;
        }

        .modal-header h2 {
            font-size: 21px;
        }

        .close {
            width: 34px;
            height: 34px;

            border: none;
            border-radius: 50%;

            background: #1c1c1c;
            color: #aaa;

            cursor: pointer;
        }

        .form-group {
            margin-bottom: 15px;
        }

        .form-group label {
            display: block;

            color: #777;
            font-size: 12px;

            margin-bottom: 7px;
        }

        .form-group input,
        .form-group select {
            width: 100%;

            padding: 15px;

            border-radius: 14px;

            border: 1px solid #252525;

            background: #080808;
            color: #fff;

            outline: none;
        }

        .form-group input:focus,
        .form-group select:focus {
            border-color: #555;
        }

        .save-btn {
            width: 100%;

            padding: 16px;

            margin-top: 5px;

            border: none;
            border-radius: 15px;

            background: #fff;
            color: #000;

            font-weight: 800;

            cursor: pointer;
        }

        /* RESET */

        .danger-text {
            color: #888;
            font-size: 13px;
            line-height: 1.6;

            margin-bottom: 20px;
        }

        .confirm-reset {
            width: 100%;

            padding: 15px;

            border: none;
            border-radius: 14px;

            background: #fff;
            color: #000;

            font-weight: 800;

            cursor: pointer;
        }

        .cancel-reset {
            width: 100%;

            padding: 15px;

            margin-top: 9px;

            border: 1px solid #252525;
            border-radius: 14px;

            background: #151515;
            color: #aaa;

            font-weight: 700;

            cursor: pointer;
        }

        @media (min-width: 700px) {
            #app {
                padding-top: 30px;
            }

            .modal {
                align-items: center;
            }
        }
    </style>
</head>

<body>

<!-- =========================
     STARTUP
========================= -->

<div id="splash">
    <div class="splash-content">

        <div class="x7-logo">X7</div>

        <div class="good-morning">
            GOOD MORNING, X7.
        </div>

        <div class="quote" id="quote">
            Stay focused. Keep building.
        </div>

        <div class="loading-line"></div>

    </div>
</div>


<!-- =========================
     APP
========================= -->

<div id="app">

    <div class="container">

        <header>

            <div class="brand">

                <div class="brand-mark">
                    X7
                </div>

                <div>
                    <div class="brand-name">
                        Money
                    </div>

                    <div class="brand-sub">
                        PERSONAL FINANCE
                    </div>
                </div>

            </div>

        </header>


        <!-- BALANCE -->

        <div class="balance-card">

            <div class="balance-label">
                TOTAL BALANCE
            </div>

            <div class="balance">
                <span class="currency">₹</span><span id="balance">0</span>
            </div>

        </div>


        <!-- STATS -->

        <div class="stats">

            <div class="stat-card">

                <div class="stat-title">
                    INCOME
                </div>

                <div class="stat-value income">
                    ₹<span id="income">0</span>
                </div>

            </div>


            <div class="stat-card">

                <div class="stat-title">
                    EXPENSES
                </div>

                <div class="stat-value expense">
                    ₹<span id="expenses">0</span>
                </div>

            </div>

        </div>


        <!-- ACTIONS -->

        <div class="actions">

            <button
                class="action-btn add-btn"
                onclick="openAddModal()">

                + Add Money

            </button>

            <button
                class="action-btn reset-btn"
                onclick="openResetModal()">

                Reset Money

            </button>

        </div>


        <!-- TRANSACTIONS -->

        <div class="section-title">

            <h2>
                Transactions
            </h2>

            <div
                class="count"
                id="transactionCount">

                0 transactions

            </div>

        </div>


        <div
            class="transactions"
            id="transactions">

        </div>

    </div>

</div>


<!-- =========================
     ADD MONEY MODAL
========================= -->

<div
    class="modal"
    id="addModal">

    <div class="modal-content">

        <div class="modal-header">

            <h2>
                Add Transaction
            </h2>

            <button
                class="close"
                onclick="closeAddModal()">

                ×

            </button>

        </div>


        <div class="form-group">

            <label>
                DESCRIPTION
            </label>

            <input
                id="description"
                type="text"
                placeholder="Salary, food, shopping..."
            >

        </div>


        <div class="form-group">

            <label>
                AMOUNT
            </label>

            <input
                id="amount"
                type="number"
                inputmode="decimal"
                placeholder="0"
            >

        </div>


        <div class="form-group">

            <label>
                TYPE
            </label>

            <select id="type">

                <option value="income">
                    Income
                </option>

                <option value="expense">
                    Expense
                </option>

            </select>

        </div>


        <button
            class="save-btn"
            onclick="addTransaction()">

            SAVE TRANSACTION

        </button>

    </div>

</div>


<!-- =========================
     RESET MODAL
========================= -->

<div
    class="modal"
    id="resetModal">

    <div class="modal-content">

        <div class="modal-header">

            <h2>
                Reset Money
            </h2>

            <button
                class="close"
                onclick="closeResetModal()">

                ×

            </button>

        </div>


        <div class="danger-text">

            This will permanently remove all your
            transactions and reset your balance to
            ₹0.

            <br><br>

            This action cannot be undone.

        </div>


        <button
            class="confirm-reset"
            onclick="resetMoney()">

            YES, RESET EVERYTHING

        </button>


        <button
            class="cancel-reset"
            onclick="closeResetModal()">

            CANCEL

        </button>

    </div>

</div>


<script>

    /* =========================
       MOTIVATIONAL QUOTES
    ========================= */

    const quotes = [

        "Small steps. Big results.",

        "Discipline creates freedom.",

        "Your future is built by what you do today.",

        "Don't chase money. Build value.",

        "Stay focused. Keep building.",

        "Your habits decide your future.",

        "Make your money work for you.",

        "Consistency beats motivation.",

        "Think long term. Move today.",

        "One day or day one. You decide.",

        "Build quietly. Let the results speak.",

        "Control your money before it controls you.",

        "Every rupee has a purpose.",

        "You don't need more money. You need more control.",

        "Focus on progress, not perfection."

    ];


    /* =========================
       DATA
    ========================= */

    let transactions =
        JSON.parse(
            localStorage.getItem("x7_transactions")
        ) || [];


    /* =========================
       STARTUP
    ========================= */

    function showRandomQuote() {

        const quote =
            quotes[
                Math.floor(
                    Math.random() * quotes.length
                )
            ];

        document.getElementById("quote").textContent =
            `"${quote}"`;

    }


    showRandomQuote();


    window.addEventListener(
        "load",
        () => {

            setTimeout(
                () => {

                    document
                        .getElementById("splash")
                        .classList
                        .add("hidden");

                },
                2800
            );

        }
    );


    /* =========================
       FORMAT MONEY
    ========================= */

    function formatMoney(amount) {

        return Number(amount).toLocaleString(
            "en-IN",
            {
                maximumFractionDigits: 2
            }
        );

    }


    /* =========================
       SAVE
    ========================= */

    function saveData() {

        localStorage.setItem(
            "x7_transactions",
            JSON.stringify(transactions)
        );

    }


    /* =========================
       CALCULATE
    ========================= */

    function calculate() {

        let income = 0;
        let expenses = 0;

        transactions.forEach(
            transaction => {

                if (transaction.type === "income") {

                    income += transaction.amount;

                } else {

                    expenses += transaction.amount;

                }

            }
        );

        const balance =
            income - expenses;


        document.getElementById("income")
            .textContent =
            formatMoney(income);

        document.getElementById("expenses")
            .textContent =
            formatMoney(expenses);

        document.getElementById("balance")
            .textContent =
            formatMoney(balance);

    }


    /* =========================
       RENDER TRANSACTIONS
    ========================= */

    function renderTransactions() {

        const container =
            document.getElementById(
                "transactions"
            );

        container.innerHTML = "";


        if (transactions.length === 0) {

            container.innerHTML = `
                <div class="empty">
                    No transactions yet.<br>
                    Start building your money history.
                </div>
            `;

        } else {

            transactions
                .slice()
                .reverse()
                .forEach(
                    transaction => {

                        const div =
                            document.createElement(
                                "div"
                            );

                        div.className =
                            "transaction";


                        const sign =
                            transaction.type === "income"
                                ? "+"
                                : "-";


                        const icon =
                            transaction.type === "income"
                                ? "↗"
                                : "↘";


                        div.innerHTML = `

                            <div class="transaction-left">

                                <div class="transaction-icon">
                                    ${icon}
                                </div>

                                <div>

                                    <div class="transaction-name">
                                        ${escapeHTML(transaction.description)}
                                    </div>

                                    <div class="transaction-date">
                                        ${transaction.date}
                                    </div>

                                </div>

                            </div>


                            <div class="
                                transaction-amount
                                ${transaction.type}
                            ">

                                ${sign} ₹${formatMoney(transaction.amount)}

                            </div>

                        `;


                        container.appendChild(div);

                    }
                );

        }


        const count =
            transactions.length;

        document.getElementById(
            "transactionCount"
        ).textContent =
            `${count} transaction${count === 1 ? "" : "s"}`;

    }


    /* =========================
       SECURITY
    ========================= */

    function escapeHTML(text) {

        const div =
            document.createElement("div");

        div.textContent = text;

        return div.innerHTML;

    }


    /* =========================
       ADD TRANSACTION
    ========================= */

    function addTransaction() {

        const description =
            document
                .getElementById("description")
                .value
                .trim();


        const amount =
            parseFloat(
                document
                    .getElementById("amount")
                    .value
            );


        const type =
            document
                .getElementById("type")
                .value;


        if (!description) {

            alert(
                "Please enter a description."
            );

            return;

        }


        if (!amount || amount <= 0) {

            alert(
                "Please enter a valid amount."
            );

            return;

        }


        transactions.push({

            id: Date.now(),

            description,

            amount,

            type,

            date:
                new Date()
                    .toLocaleDateString(
                        "en-IN",
                        {
                            day: "numeric",
                            month: "short",
                            year: "numeric"
                        }
                    )

        });


        saveData();

        renderTransactions();

        calculate();

        closeAddModal();


        document.getElementById(
            "description"
        ).value = "";


        document.getElementById(
            "amount"
        ).value = "";

    }


    /* =========================
       RESET MONEY
    ========================= */

    function resetMoney() {

        transactions = [];

        localStorage.removeItem(
            "x7_transactions"
        );

        renderTransactions();

        calculate();

        closeResetModal();

    }


    /* =========================
       ADD MODAL
    ========================= */

    function openAddModal() {

        document
            .getElementById("addModal")
            .classList
            .add("show");

    }


    function closeAddModal() {

        document
            .getElementById("addModal")
            .classList
            .remove("show");

    }


    /* =========================
       RESET MODAL
    ========================= */

    function openResetModal() {

        document
            .getElementById("resetModal")
            .classList
            .add("show");

    }


    function closeResetModal() {

        document
            .getElementById("resetModal")
            .classList
            .remove("show");

    }


    /* =========================
       CLOSE MODALS
    ========================= */

    window.addEventListener(
        "click",
        event => {

            if (
                event.target ===
                document.getElementById("addModal")
            ) {

                closeAddModal();

            }


            if (
                event.target ===
                document.getElementById("resetModal")
            ) {

                closeResetModal();

            }

        }
    );


    /* =========================
       INITIALIZE
    ========================= */

    renderTransactions();

    calculate();

</script>

</body>
</html>
